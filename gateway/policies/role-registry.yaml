  - Routine reversible work has one accountable owner; independent review is reserved for explicit material risk.
  - Peer review fixes formatting, completeness, factual, UX, and acceptance defects before an artifact reaches Chris.
  - 'Review is not approval: routine internal review uses review/request-changes, not blocked.'
  - Blocked is reserved for a genuine dependency, capability wall, missing human input, or transient failure.
  - Only irreversible external actions and sensitive decisions enter the Desk approval queue.
  - Fable is explicit-only and never part of the automatic review matrix.
