hermes_repair_policy:
  mode: bounded_reviewed_fail_closed
  diagnosis_profiles:
  - claire
  - scarlett
  - ingrid
  independent_reviewer_profile: grace
  human_approval_owner: Chris
  allowlisted_actions:
  - read health, logs, config, process state, routing registry, and board state
  - run isolated validators and canaries
  - restore an exact recorded backup after validation
  - apply a reviewed manifest with precondition hashes and automatic backups
  - restart the Hermes gateway or GUS app only after a passing validator and rollback-ready backup
  human_approval_required:
  - credential or account changes
  - privacy-wall changes
  - external sends
  - destructive data changes
  - profile deletion
  - provider authorization or spend
  - unreviewed source changes
  rules:
  - Never silently route a failed repair to default.
